# Configuração do Servidor
server.port=8080

# Conexão com o Banco de Dados (Exemplo MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/delivery_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sua_senha_segura
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Configuraçõlses de Log
# Configurações de Log
logging.level.org.springframework=INFO
logging.level.com.seu_pacote=DEBUG      
logging.level.com.deliverytechy.delivery_api=DEBUG      
# Configurações de Segurança (Exemplo JWT)
jwt.secret=seu_segredo_jwt
jwt.expiration=3600000 # 1 hora em milissegundos    # Configurações de CORS
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE
cors.allowed-headers=Authorization,Content-Type
cors.allow-credentials=true 
